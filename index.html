<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Administrasi Inspiratif - SMP Maarif NU Pandaan</title>
    <meta name="description" content="Sistem Informasi Akademik, Keuangan, Waka Kurikulum, dan SPMB 2027/2028 SMP Maarif NU Pandaan Terintegrasi Midtrans dan Notifikasi Real-time" />
    <meta property="og:title" content="Portal Administrasi Inspiratif - SMP Maarif NU Pandaan" />
    <meta property="og:description" content="Sistem Informasi Akademik, Keuangan, Waka Kurikulum, dan SPMB 2027/2028 SMP Maarif NU Pandaan Terintegrasi Midtrans dan Notifikasi Real-time" />
    <!-- Modern SVG fallback favicon using a graduation hat emoji -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <!-- PWA Installation Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Standalone zero-dependency styles for instant preloader render */
      #app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .preloader-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 36px 28px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
      }
      .preloader-badge {
        width: 68px;
        height: 68px;
        background: #ecfdf5;
        border: 2px solid #a7f3d0;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin: 0 auto 20px auto;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
      }
      .preloader-title {
        font-size: 15px;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 6px 0;
        letter-spacing: -0.01em;
      }
      .preloader-sub {
        font-size: 12px;
        font-weight: 600;
        color: #059669;
        margin: 0 0 20px 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .preloader-spinner-bar {
        width: 100%;
        height: 6px;
        background-color: #f1f5f9;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }
      .preloader-spinner-line {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #10b981, #059669);
        border-radius: 999px;
        animation: preloader-slide 1.4s ease-in-out infinite;
      }
      .preloader-text {
        font-size: 12px;
        color: #64748b;
        margin: 0;
      }
      .preloader-timeout-box {
        display: none;
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px dashed #cbd5e1;
      }
      .preloader-retry-btn {
        background-color: #059669;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      .preloader-retry-btn:hover {
        background-color: #047857;
      }
      @keyframes preloader-slide {
        0% { left: -40%; width: 30%; }
        50% { width: 55%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root">
      <!-- Instant preloader visible before React initializes -->
      <div id="app-preloader">
        <div class="preloader-card">
          <div class="preloader-badge">🎓</div>
          <h1 class="preloader-title">SMP MA'ARIF NU PANDAAN</h1>
          <div class="preloader-sub">Portal Administrasi Terpadu</div>
          <div class="preloader-spinner-bar">
            <div class="preloader-spinner-line"></div>
          </div>
          <p class="preloader-text" id="preloader-status-text">Menyiapkan koneksi sistem &amp; memuat aset...</p>
          <div id="preloader-timeout" class="preloader-timeout-box">
            <p style="font-size: 11px; color: #64748b; margin-bottom: 12px; line-height: 1.5;">
              Waktu muat lebih lama dari biasanya. Jika tampilan tidak berubah, silakan segarkan halaman atau bersihkan cache.
            </p>
            <button type="button" class="preloader-retry-btn" onclick="window.location.reload(true)">
              Segarkan Halaman
            </button>
          </div>
        </div>
      </div>
      <script>
        // If React does not mount within 6 seconds, show manual refresh option
        setTimeout(function() {
          var timeoutBox = document.getElementById('preloader-timeout');
          if (timeoutBox) {
            timeoutBox.style.display = 'block';
          }
          var statusText = document.getElementById('preloader-status-text');
          if (statusText) {
            statusText.innerText = 'Menghubungkan ke server...';
          }
        }, 6000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
